services:
  - type: web
    name: arecanut-disease-detection
    runtime: docker
    plan: standard
    healthCheckPath: /
    buildCommand: bash build.sh
    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: 3306
      - key: MEDIA_ROOT
        value: /app/media
    disk:
      name: arecanut-media
      mountPath: /app/media
      sizeGB: 2
